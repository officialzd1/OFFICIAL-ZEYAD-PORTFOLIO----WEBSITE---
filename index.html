<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEYAD PORTFOLIO | SOON</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .maintenance-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        h1 {
            color: #d4af37;
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .calendar-wrapper {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            text-align: right;
        }

        .calendar-header {
            font-size: 1rem;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 12px;
            text-align: center;
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-weight: bold;
            color: #888;
            margin-bottom: 8px;
            font-size: 0.8rem;
            text-align: center;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .day-cell.available {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .day-cell.available:hover {
            background-color: #2ecc71;
            color: #000;
            transform: scale(1.05);
        }

        .day-cell.busy {
            background-color: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .day-cell.empty {
            background: transparent;
        }

        .booking-modal {
            margin-top: 15px;
            background: #181818;
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            display: none;
        }

        .booking-modal h3 {
            color: #d4af37;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .booking-modal input {
            width: 100%;
            padding: 7px;
            margin-bottom: 8px;
            background: #0b0b0b;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .booking-modal input:focus {
            border-color: #d4af37;
            outline: none;
        }

        .confirm-btn {
            background-color: #25d366;
            color: #fff;
            border: none;
            padding: 7px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
        }

        @media screen and (max-width: 600px) {
            .maintenance-container {
                padding: 12px;
            }
            h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- الكلمة الرئيسية فقط -->
        <h1>قريباً | SOON</h1>

        <!-- جدول الحجوزات وأيام الأسبوع -->
        <div class="calendar-wrapper">
            <div class="calendar-header">أغسطس 2026</div>
            <div class="weekdays-grid">
                <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
            </div>
            <div id="days-grid" class="days-grid"></div>
        </div>

        <!-- صندوق إدخال الحجز عند الضغط على يوم -->
        <div id="booking-modal" class="booking-modal">
            <h3>تأكيد الحجز ليوم: <span id="selected-date-text"></span></h3>
            <form id="booking-form">
                <input type="text" id="client-name" placeholder="اسمك الكريم" required>
                <input type="text" id="project-type" placeholder="نوع المشروع" required>
                <button type="submit" class="confirm-btn">إرسال الحجز للواتساب</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const daysGrid = document.getElementById('days-grid');
            const bookingModal = document.getElementById('booking-modal');
            const selectedDateText = document.getElementById('selected-date-text');
            const bookingForm = document.getElementById('booking-form');
            
            let selectedDate = '';
            const busyDays = [6, 10, 15, 20, 25];
            const totalDays = 31;
            const startDayOffset = 6;

            daysGrid.innerHTML = '';

            for (let i = 0; i < startDayOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                daysGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.textContent = day;

                if (busyDays.includes(day)) {
                    dayCell.classList.add('busy');
                } else {
                    dayCell.classList.add('available');
                    dayCell.addEventListener('click', function() {
                        selectedDate = `أغسطس ${day}, 2026`;
                        selectedDateText.textContent = selectedDate;
                        bookingModal.style.display = 'block';
                    });
                }
                daysGrid.appendChild(dayCell);
            }

            bookingForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const clientName = document.getElementById('client-name').value;
                const projectType = document.getElementById('project-type').value;
                const myWhatsAppNumber = "966500000000"; 
                
                const message = `مرحباً زياد، أرغب بحجز موعد:\n- التاريخ: ${selectedDate}\n- الاسم: ${clientName}\n- المشروع: ${projectType}`;
                window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`, '_blank');
            });
        });
    </script>
</body>
</html>
