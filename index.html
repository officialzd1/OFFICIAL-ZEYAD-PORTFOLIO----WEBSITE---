<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEYAD PORTFOLIO | تحت الصيانة والحجز</title>
    <style>
        /* تنسيقات عامة - أسود وذهبي فاخر */
        body {
    background-color: #0b0b0b;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

        .maintenance-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 {
            color: #d4af37; /* ذهبي فخم */
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .sub-text {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* زر الواتساب السريع */
        .whatsapp-quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #25d366;
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 30px;
            transition: opacity 0.3s;
        }

        .whatsapp-quick-btn:hover {
            opacity: 0.9;
        }

        /* تنسيقات قسم التقويم المصغر */
        .calendar-wrapper {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: right;
        }

        .calendar-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 15px;
            text-align: center;
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-weight: bold;
            color: #888;
            margin-bottom: 8px;
            font-size: 0.8rem;
            text-align: center;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .day-cell.available {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .day-cell.available:hover {
            background-color: #2ecc71;
            color: #000;
            transform: scale(1.05);
        }

        .day-cell.busy {
            background-color: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .day-cell.empty {
            background: transparent;
        }

        /* صندوق إدخال الحجز */
        .booking-modal {
            margin-top: 20px;
            background: #181818;
            border: 1px solid #d4af37;
            padding: 15px;
            border-radius: 8px;
            text-align: right;
            display: none;
        }

        .booking-modal h3 {
            color: #d4af37;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .booking-modal input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #0b0b0b;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .booking-modal input:focus {
            border-color: #d4af37;
            outline: none;
        }

        .confirm-btn {
            background-color: #25d366;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
        }

        /* --- دعم توافقية الشاشات والجوالات --- */
@media screen and (max-width: 600px) {
    body {
        padding: 10px;
    }

    .maintenance-container {
        margin: 15px auto;
        padding: 15px;
    }

    h1 {
        font-size: 1.4rem;
    }

    .sub-text {
        font-size: 0.85rem;
    }

    .calendar-wrapper {
        padding: 10px;
    }

    .weekdays-grid {
        font-size: 0.75rem;
    }

    .day-cell {
        font-size: 0.75rem;
    }

    .whatsapp-quick-btn {
        font-size: 0.85rem;
        padding: 8px 15px;
    }
}

    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- رسالة الصيانة القصيرة والفخمة -->
        <h1>الموقع تحت التحديثات الإبداعية</h1>
        <div class="sub-text">نعمل على تطوير استوديو المونتاج. يمكنك حجز موعدك مباشرة من هنا:</div>

        <!-- زر تواصل واتساب سريع -->
        <a href="https://wa.me/966560260300" target="_blank" class="whatsapp-quick-btn">
            💬 تواصل سريع عبر الواتساب
        </a>

        <!-- قسم الحجوزات المصغر -->
        <div class="calendar-wrapper">
            <div class="calendar-header">أغسطس 2026 - اختر يوم الموعد</div>
            <div class="weekdays-grid">
                <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
            </div>
            <div id="days-grid" class="days-grid">
                <!-- الأيام تتولد بالجافا سكريبت -->
            </div>
        </div>

        <!-- صندوق تأكيد الحجز -->
        <div id="booking-modal" class="booking-modal">
            <h3>تأكيد الحجز ليوم: <span id="selected-date-text"></span></h3>
            <form id="booking-form">
                <input type="text" id="client-name" placeholder="اسمك الكريم" required>
                <input type="text" id="project-type" placeholder="نوع المشروع (يوتيوب، ريلز...)" required>
                <button type="submit" class="confirm-btn">إرسال الحجز للواتساب</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const daysGrid = document.getElementById('days-grid');
            const bookingModal = document.getElementById('booking-modal');
            const selectedDateText = document.getElementById('selected-date-text');
            const bookingForm = document.getElementById('booking-form');
            
            let selectedDate = '';
            const busyDays = [6, 10, 15, 20, 25]; // الأيام المشغولة (بالأحمر)
            const totalDays = 31;
            const startDayOffset = 6; // السبت

            daysGrid.innerHTML = '';

            for (let i = 0; i < startDayOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                daysGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.textContent = day;

                if (busyDays.includes(day)) {
                    dayCell.classList.add('busy');
                } else {
                    dayCell.classList.add('available');
                    dayCell.addEventListener('click', function() {
                        selectedDate = `أغسطس ${day}, 2026`;
                        selectedDateText.textContent = selectedDate;
                        bookingModal.style.display = 'block';
                    });
                }
                daysGrid.appendChild(dayCell);
            }

            bookingForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const clientName = document.getElementById('client-name').value;
                const projectType = document.getElementById('project-type').value;
                const myWhatsAppNumber = "966560260300"; // استبدل برقمك
                
                const message = `مرحباً زياد، أرغب بحجز موعد:\n- التاريخ: ${selectedDate}\n- الاسم: ${clientName}\n- المشروع: ${projectType}`;
                window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`, '_blank');
            });
        });
    </script>
</body>
</html>
